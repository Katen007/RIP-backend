<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TxtMetric — {{ .order.Title }}</title>
  
  <link rel="stylesheet" href="/static/styles/order_style.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>

  <!-- хедер  -->
  <header class="header">
    <a class="brand" href="/texts">TxtMetric</a>
  </header>


  
  <h1 class="page-title">{{ .order.Title }}</h1>

  
  <main class="container">
  <section class="detail-grid">
    <figure class="card">
      <img src="{{ .order.ImageURL }}" alt="{{ .order.Title }}">
    </figure>
    <div class="card muted desc">
      {{ .order.Description }}
      
    </div>
     <div class="price-chip" aria-label="Цена услуги">
        <span class="price-chip__label">Цена:</span>
        <span class="price-chip__value">{{ .order.Price }}&nbsp;₽</span>
      </div>
    
  </section>

  
</main>

</body>
</html>
