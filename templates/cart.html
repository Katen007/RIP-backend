<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TxtMetric — Заявка</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/styles/index_style.css">
  <link rel="stylesheet" href="/static/styles/cart.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="/texts">TxtMetric</a>
  </header>

  <main class="container">
    <div class="titlebar">
      <h1 class="page-title" style="margin:0">Составление заявки</h1>
      <button class="btn-save" onclick="alert('Черновик сохранён (демо)')">Сохранить</button>
    </div>

    {{ if not .items }}
      <p class="muted">Заявка пуста. Перейдите на <a href="/texts">страницу текстов</a> и добавьте услуги кликом по картинке.</p>
    {{ else }}
    <section class="list">
      {{ range .items }}
      <article class="row">
        <img class="row__img" src="{{ .ImageURL }}" alt="{{ .Title }}">
        <div>
          <h3 class="row__title">{{ .Title }}</h3>
          
          <a class="row__btn" href="/order/{{ .ID }}">Подробнее</a>
        </div>
        <div>
          <select class="row__sel">
            <option value="">Выберите формулу</option>
            <option>Флеша</option>
            <option>Индекс Фога</option>
            <option>SMOG</option>
          </select>
        </div>
        <a class="icon-btn" href="/cart/remove/{{ .ID }}" title="Удалить">
          <img src="http://localhost:9000/images/img/icon_trash.svg" width="22" height="22" alt="Удалить">
        </a>
      </article>
      {{ end }}
    </section>
    
    {{ end }}

  </main>

  <div class="total">
    <label for="orderTotal" class="total__label">Итоговая сумма:</label>
    <output id="orderTotal" class="total__value">{{ .total }}</output>
    <span>₽</span>
  </div>

  
  
</body>
</html>
