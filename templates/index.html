<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TxtMetric — Тексты</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/styles/index_style.css">

</head>
<body>
  <header class="header">
    <a class="brand" href="/texts" aria-label="Домой">TxtMetric</a>
  </header>

  <main class="container">
    <h1 class="page-title">Тексты</h1>

    <!-- поиск-->
    <form class="search" action="/texts" method="GET">
      <input type="text" name="query" placeholder="Поиск текстов" value="{{ .query }}">
      
    </form>

     <!-- плитка карточек */ -->
    <section class="grid">
      {{ range .orders }}
      <article class="card" data-id="{{ .ID }}">
        <!-- <a href="/hello/{{ .ID }}"> -->
        <a href="/orders?addItem={{ .ID }}&query={{$.query}}">
          <img class="card__img" src="{{ .ImageURL }}" alt="{{ .Title }}">
        </a>
        <div class="card__body">
          <h3 class="card__title">{{ .Title }}</h3>
          <a class="btn" href="/order/{{ .ID }}">Подробнее</a>
        </div>
      </article>
      {{ end }}
    </section>
  </main>
  <a class="cart" href="/cart/{{.cartId}}" title="Текущая заявка">
    <img src="/static/img/cart2.svg" 
     class="cart__icon" 
     width="24" height="24" 
     alt="Корзина">
    <span class="cart__badge">{{ if .cartCount }}{{ .cartCount }}{{ else }}0{{ end }}</span>
  </a>
  

</body>
</html>
